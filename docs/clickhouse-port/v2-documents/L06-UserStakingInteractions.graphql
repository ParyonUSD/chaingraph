# L6 UserStakingInteractions (v1: v1/L06-UserStakingInteractions.graphql)
# status: works
# chipnet equality: equal (v1 28 rows in 1 pages, v2 28 rows in 1 pages)
# latency (chipnet_ch_pp2, p50 warm, first page): v2 183.6 ms; v1 Hasura/Postgres 7.6 ms
query UserStakingInteractions($poolTokenId: Hex, $userLockingBytecodes: [Hex!], $fromBlockHeight: Int, $toBlockHeight: Int, $node: String!, $limit: Int!, $after: BigInt) {
  transaction: transactions(node: $node, limit: $limit, after: $after, where: {
    has_input: { outpoint: { token_category: { _eq: $poolTokenId }, nonfungible_token_capability: { _eq: MINTING } } }
    _and: [{ has_input: { outpoint: { locking_bytecode: { _in: $userLockingBytecodes } } } }]
    block_window: { from_height: $fromBlockHeight, to_height: $toBlockHeight }
  }) {
    has_more end_cursor
    nodes {
      internal_id hash
      block_inclusions { block { timestamp height } }
      outputs { value_satoshis locking_bytecode fungible_token_amount nonfungible_token_commitment nonfungible_token_capability token_category }
      inputs { outpoint { value_satoshis locking_bytecode fungible_token_amount nonfungible_token_commitment nonfungible_token_capability token_category } }
    }
  }
}
