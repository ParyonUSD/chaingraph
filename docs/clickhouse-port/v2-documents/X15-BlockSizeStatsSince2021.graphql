# X15 BlockSizeStatsSince2021 (v1: v1/X15-BlockSizeStatsSince2021.graphql)
# status: works
# chipnet equality: equal (v1 1 rows in 1 pages, v2 1 rows in 1 pages)
# latency (chipnet: chipnet_ch_pp2 data + authchain index, p50 warm, first page): v2 25.8 ms; v1 Hasura/Postgres 336.4 ms
query BlockSizeStatsSince2021($node: String!, $since: BigInt!) {
  block_aggregate: blocks_aggregate(node: $node, where: { timestamp: { _gt: $since } }) {
    aggregate {
      count
      max { size_bytes }
      min { size_bytes }
      avg { size_bytes }
      sum { size_bytes }
    }
  }
}
