# L34 ContractOutputsByHash (v1: v1/L34-ContractOutputsByHash.graphql)
# status: works
# chipnet equality: equal (v1 5 rows in 1 pages, v2 5 rows in 1 pages)
# latency (chipnet: chipnet_ch_pp2 data + authchain index, p50 warm, first page): v2 62.0 ms; v1 Hasura/Postgres 5.4 ms
query ContractOutputsByHash($tokenId: Hex!, $lockingBytecode: Hex!, $transactionHashes: [Hex!]!, $node: String!) {
  output: outputs_by_transaction_hash(transaction_hashes: $transactionHashes, where: { token_category: { _eq: $tokenId }, nonfungible_token_capability: { _eq: MUTABLE }, locking_bytecode: { _eq: $lockingBytecode } }) {
    output_index transaction_hash
    spent_by {
      transaction {
        node_validations(node: $node) { node_internal_id }
        accepted_block_inclusions: block_inclusions(accepted_by: $node) { block_internal_id }
      }
    }
    transaction {
      internal_id hash
      node_validations(node: $node) { node_internal_id }
      accepted_block_inclusions: block_inclusions(accepted_by: $node) { block_internal_id }
      block_inclusions { block { timestamp height } }
      outputs { value_satoshis fungible_token_amount nonfungible_token_commitment nonfungible_token_capability token_category }
      inputs { outpoint { value_satoshis fungible_token_amount nonfungible_token_commitment nonfungible_token_capability token_category } }
    }
  }
}
