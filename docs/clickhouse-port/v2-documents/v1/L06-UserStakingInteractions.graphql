# L6 v1 (paryon_library-integration 7c36376, gqlQueryStakingInteractions)
query UserStakingInteractions($poolTokenId: bytea, $userLockingBytecodes: [bytea!], $fromBlockHeight: bigint, $toBlockHeight: bigint, $node: String!, $limit: Int!, $afterInternalId: bigint!) {
  transaction(
    limit: $limit
    order_by: {internal_id: asc}
    where: {internal_id: {_gt: $afterInternalId}, inputs: {outpoint: {token_category: {_eq: $poolTokenId}, _and: {nonfungible_token_capability: {_eq: "minting"}}}}, _and: [{inputs: {outpoint: {locking_bytecode: {_in: $userLockingBytecodes}}}}, {_or: [{block_inclusions: {block: {height: {_gte: $fromBlockHeight, _lt: $toBlockHeight}}}}, {_not: {block_inclusions: {}}}]}], _or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}
  ) {
    internal_id
    hash
    block_inclusions {
      block {
        timestamp
        height
      }
    }
    outputs {
      value_satoshis
      locking_bytecode
      fungible_token_amount
      nonfungible_token_commitment
      nonfungible_token_capability
      token_category
    }
    inputs {
      outpoint {
        value_satoshis
        locking_bytecode
        fungible_token_amount
        nonfungible_token_commitment
        nonfungible_token_capability
        token_category
      }
    }
  }
}
