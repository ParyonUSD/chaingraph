# L9 v1 (paryon_library-integration 7c36376, gqlQueryUserRedemptionSidecarCommitments)
query UserRedemptionSidecarCommitments($redeemerTokenId: bytea, $userLockingBytecodes: [bytea!], $node: String!, $limit: Int!, $afterInternalId: bigint!) {
  transaction(
    limit: $limit
    order_by: {internal_id: asc}
    where: {internal_id: {_gt: $afterInternalId}, inputs: {outpoint: {token_category: {_eq: $redeemerTokenId}}}, _and: [{_or: [{inputs: {outpoint: {locking_bytecode: {_in: $userLockingBytecodes}}}}, {outputs: {locking_bytecode: {_in: $userLockingBytecodes}}}]}], _or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}
  ) {
    internal_id
    hash
    outputs(
      where: {token_category: {_eq: $redeemerTokenId}, nonfungible_token_capability: {_eq: "none"}}
    ) {
      nonfungible_token_commitment
    }
    inputs(
      where: {outpoint: {token_category: {_eq: $redeemerTokenId}, nonfungible_token_capability: {_eq: "none"}}}
    ) {
      outpoint {
        nonfungible_token_commitment
      }
    }
  }
}
