# L27 v1 (paryon_library-integration 7c36376, gqlQueryAllUserBorrowingTxs)
query LoanBorrowingTx($userLockingBytecodes: [bytea!], $paryonTokenId: bytea, $node: String!, $limit: Int!, $afterInternalId: bigint!) {
  transaction(
    limit: $limit
    order_by: {internal_id: asc}
    where: {internal_id: {_gt: $afterInternalId}, outputs: {locking_bytecode: {_in: $userLockingBytecodes}}, _and: {outputs: {token_category: {_eq: $paryonTokenId}, _and: {nonfungible_token_capability: {_eq: "minting"}}}}, _or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}
  ) {
    internal_id
    outputs(where: {output_index: {_eq: "3"}}) {
      output_index
      token_category
    }
  }
}
