# L36 v1 (paryon_library-integration 7c36376, subscriptionPriceContract)
subscription MonitorPriceContractUTXOs($paryonTokenId: bytea!, $priceContractLockingBytecode: bytea!, $node: String!) {
  output(
    where: {token_category: {_eq: $paryonTokenId}, _and: {nonfungible_token_capability: {_eq: "mutable"}, locking_bytecode: {_eq: $priceContractLockingBytecode}}, transaction: {_or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}, _not: {spent_by: {transaction: {_or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}}}}
  ) {
    output_index
    transaction_hash
    transaction {
      block_inclusions {
        block {
          timestamp
          height
        }
      }
      outputs {
        value_satoshis
        fungible_token_amount
        nonfungible_token_commitment
        nonfungible_token_capability
        token_category
      }
      inputs {
        outpoint {
          value_satoshis
          fungible_token_amount
          nonfungible_token_commitment
          nonfungible_token_capability
          token_category
        }
      }
    }
  }
}
