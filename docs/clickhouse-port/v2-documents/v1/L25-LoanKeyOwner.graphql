# L25 v1 (paryon_library-integration 7c36376, gqlQueryLoanKeyOwner)
query LoanKeyOwner($loanKey: bytea, $node: String!) {
  output(
    where: {token_category: {_eq: $loanKey}, _and: {nonfungible_token_capability: {_eq: "minting"}}, transaction: {_or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}, _not: {spent_by: {transaction: {_or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}}}}
  ) {
    locking_bytecode
    transaction_hash
  }
}
