# L10 v1 (paryon_library-integration 7c36376, gqlQueryUserRedemptionInteractions)
query UserRedemptionInteractions($redeemerTokenId: bytea, $sidecarCommitments: [bytea!], $fromBlockHeight: bigint, $toBlockHeight: bigint, $node: String!, $limit: Int!, $afterInternalId: bigint!) {
  transaction(
    limit: $limit
    order_by: {internal_id: asc}
    where: {internal_id: {_gt: $afterInternalId}, inputs: {outpoint: {token_category: {_eq: $redeemerTokenId}}}, _and: [{_or: [{block_inclusions: {block: {height: {_gte: $fromBlockHeight, _lt: $toBlockHeight}}}}, {_not: {block_inclusions: {}}}]}, {_or: [{outputs: {token_category: {_eq: $redeemerTokenId}, nonfungible_token_capability: {_eq: "none"}, nonfungible_token_commitment: {_in: $sidecarCommitments}}}, {inputs: {outpoint: {token_category: {_eq: $redeemerTokenId}, nonfungible_token_capability: {_eq: "none"}, nonfungible_token_commitment: {_in: $sidecarCommitments}}}}]}], _or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}
  ) {
    internal_id
    hash
    block_inclusions {
      block {
        timestamp
        height
      }
    }
    outputs {
      value_satoshis
      fungible_token_amount
      nonfungible_token_commitment
      nonfungible_token_capability
      token_category
    }
    inputs {
      outpoint_transaction_hash
      outpoint {
        value_satoshis
        fungible_token_amount
        nonfungible_token_commitment
        nonfungible_token_capability
        token_category
      }
    }
  }
}
