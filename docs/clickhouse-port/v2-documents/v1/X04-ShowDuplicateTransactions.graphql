# X4 v1 (chaingraph.cash 3bacf3c examples.tsx: Inspect Duplicate Transactions)
query ShowDuplicateTransactions {
  transaction( where: { hash: { _in: [
    "\\xe3bf3d07d4b0375638d5f1db5255fe07ba2c4cb067cd81b84ee974b6585fb468"
    "\\xd5d27987d2a3dfc724e359870c6644b40e497bdc0589a033220fe15429d88599"
  ] } } ) {
    hash
    is_coinbase
    output_value_satoshis
    block_inclusions {
      block {
        hash
        height
        timestamp
        size_bytes
        version
        nonce
        merkle_root
        bits
        accepted_by {
          node {
            name
            user_agent
          }
        }
      }
    }
  }
}
