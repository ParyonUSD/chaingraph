# L3 v1 (paryon_library-integration 7c36376, gqlQueryLoanInterestPayments)
query LoanInterestPayments($userLoanKeys: [bytea!], $paryonTokenId: bytea, $node: String!, $limit: Int!, $afterInternalId: bigint!) {
  transaction(
    limit: $limit
    order_by: {internal_id: asc}
    where: {internal_id: {_gt: $afterInternalId}, inputs: {outpoint: {token_category: {_in: $userLoanKeys}, _and: {nonfungible_token_capability: {_eq: "none"}}}}, _and: {inputs: {outpoint: {nonfungible_token_commitment: {_eq: "\\x07"}, nonfungible_token_capability: {_eq: "none"}, token_category: {_eq: $paryonTokenId}}}}, _or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}
  ) {
    internal_id
    hash
    outputs(where: {output_index: {_eq: "1"}}) {
      output_index
      value_satoshis
    }
    inputs(where: {input_index: {_in: ["1", "2"]}}, order_by: {input_index: asc}) {
      input_index
      outpoint {
        value_satoshis
        token_category
      }
    }
  }
}
