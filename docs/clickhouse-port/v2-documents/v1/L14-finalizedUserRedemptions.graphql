# L14 v1 (paryon_library-integration 7c36376, gqlQueryUserFinalizedRedemptions)
query finalizedUserRedemptions($paryonTokenId: bytea, $userLockingBytecodes: [bytea!], $node: String!, $limit: Int!, $afterInternalId: bigint!) {
  transaction(
    limit: $limit
    order_by: {internal_id: asc}
    where: {internal_id: {_gt: $afterInternalId}, inputs: {outpoint: {token_category: {_eq: $paryonTokenId}, nonfungible_token_capability: {_eq: "none"}, nonfungible_token_commitment: {_eq: "\\x03"}}}, outputs: {locking_bytecode: {_in: $userLockingBytecodes}}, _or: [{node_validations: {node: {name: {_eq: $node}}}}, {block_inclusions: {block: {accepted_by: {node: {name: {_eq: $node}}}}}}]}
  ) {
    internal_id
    hash
    outputs(
      where: {output_index: {_in: ["0", "1", "3"]}}
      order_by: {output_index: asc}
    ) {
      output_index
      token_category
      fungible_token_amount
      value_satoshis
    }
    inputs(
      where: {input_index: {_in: ["0", "3", "4", "5"]}}
      order_by: {input_index: asc}
    ) {
      input_index
      outpoint {
        nonfungible_token_commitment
        fungible_token_amount
        value_satoshis
      }
    }
    block_inclusions {
      block {
        timestamp
        height
      }
    }
  }
}
