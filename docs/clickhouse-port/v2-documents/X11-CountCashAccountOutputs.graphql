# X11 CountCashAccountOutputs (v1: v1/X11-CountCashAccountOutputs.graphql)
# status: works
# chipnet equality: equal (v1 1 rows in 1 pages, v2 1 rows in 1 pages)
query CountCashAccountOutputs($node: String!, $prefix: Hex!) {
  search_output_prefix_aggregate: outputs_aggregate(node: $node, where: { locking_bytecode: { _prefix: $prefix } }) {
    aggregate { count }
  }
}
