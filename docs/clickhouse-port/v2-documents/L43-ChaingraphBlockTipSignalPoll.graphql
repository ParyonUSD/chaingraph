# L43 ChaingraphBlockTipSignalPoll (v1: v1/L43-ChaingraphBlockTipSignalPoll.graphql)
# status: works
# chipnet equality: equal (v1 1 rows in 1 pages, v2 1 rows in 1 pages)
# latency (chipnet_ch_pp2, p50 warm, first page): v2 24.3 ms; v1 Hasura/Postgres 349.1 ms
query ChaingraphBlockTipSignalPoll($node: String!) {
  block: blocks(node: $node, limit: 1, order_by: { height: DESC }) { nodes { hash height previous_block_hash } }
}
