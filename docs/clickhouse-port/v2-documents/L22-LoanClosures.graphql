# L22 LoanClosures (v1: v1/L22-LoanClosures.graphql)
# status: works
# chipnet equality: equal (v1 7 rows in 1 pages, v2 7 rows in 1 pages)
query LoanClosures($paryonTokenId: Hex, $loanTokenIds: [Hex!], $node: String!, $limit: Int!, $after: BigInt) {
  transaction: transactions(node: $node, limit: $limit, after: $after, where: {
    has_input: { outpoint: { token_category: { _in: $loanTokenIds }, nonfungible_token_capability: { _eq: NONE } } }
    _and: [{
      has_input: { outpoint: { token_category: { _eq: $paryonTokenId }, nonfungible_token_capability: { _eq: MUTABLE } } }
      _not: { has_input: { outpoint: { nonfungible_token_commitment: { _eq: "07" }, nonfungible_token_capability: { _eq: NONE }, token_category: { _eq: $paryonTokenId } } } }
    }]
  }) {
    has_more end_cursor
    nodes {
      internal_id hash
      block_inclusions { block { timestamp } }
      outputs(where: { token_category: { _in: $loanTokenIds } }) { token_category }
      inputs(where: { outpoint: { nonfungible_token_capability: { _in: [NONE, MUTABLE] } } }, order_by: { input_index: ASC }) {
        input_index
        outpoint { value_satoshis locking_bytecode nonfungible_token_commitment nonfungible_token_capability token_category }
      }
    }
  }
}
