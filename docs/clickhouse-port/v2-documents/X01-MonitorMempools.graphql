# X1 MonitorMempools (v1: v1/X01-MonitorMempools.graphql)
# status: works
# chipnet equality: equal (v1 1 rows in 1 pages, v2 1 rows in 1 pages)
# latency (chipnet: chipnet_ch_pp2 data + authchain index, p50 warm, first page): v2 17.4 ms; v1 Hasura/Postgres 90.6 ms
subscription MonitorMempools($node: String!, $limit: Int = 5) {
  node(node: $node) {
    name
    user_agent
    unconfirmed_transaction_count
    unconfirmed_transactions(limit: $limit, order_by: { validated_at: DESC }) {
      validated_at
      transaction { hash input_count output_count output_value_satoshis size_bytes }
    }
  }
}
