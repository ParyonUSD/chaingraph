# X16 TransactionStats2021Q1 (v1: v1/X16-TransactionStats2021Q1.graphql)
# status: works
# chipnet equality: equal (v1 1 rows in 1 pages, v2 1 rows in 1 pages)
# latency (chipnet: chipnet_ch_pp2 data + authchain index, p50 warm, first page): v2 60.6 ms; v1 Hasura/Postgres 581.2 ms
query TransactionStats2021Q1($node: String!, $from: BigInt!, $to: BigInt!) {
  transaction_aggregate: transactions_aggregate(node: $node, where: { in_block: { timestamp: { _gt: $from, _lt: $to } } }) {
    aggregate {
      count
      max { size_bytes }
      min { size_bytes }
      avg { size_bytes }
      sum { size_bytes }
    }
  }
}
