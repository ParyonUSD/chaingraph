# L16 UserStartedAndSwappedRedemptions (v1: v1/L16-UserStartedAndSwappedRedemptions.graphql)
# status: works
# chipnet equality: equal (v1 3 rows in 1 pages, v2 3 rows in 1 pages)
# latency (chipnet_ch_pp2, p50 warm, first page): v2 177.3 ms; v1 Hasura/Postgres 2.8 ms
query UserStartedAndSwappedRedemptions($redeemerTokenId: Hex, $sidecarCommitments: [Hex!], $node: String!, $limit: Int!, $after: String) {
  output: outputs(node: $node, limit: $limit, after: $after,
    order_by: [{ transaction: { internal_id: ASC } }, { output_index: ASC }],
    where: {
      token_category: { _eq: $redeemerTokenId }, nonfungible_token_capability: { _eq: MUTABLE }
      transaction: { has_output: { token_category: { _eq: $redeemerTokenId }, nonfungible_token_capability: { _eq: NONE }, nonfungible_token_commitment: { _in: $sidecarCommitments } } }
    }) {
    has_more end_cursor
    nodes {
      transaction_hash output_index nonfungible_token_commitment
      spent_by { transaction { hash } }
      transaction {
        outputs(where: { output_index: { _lt: 8 } }, order_by: { output_index: ASC }) { token_category nonfungible_token_commitment nonfungible_token_capability fungible_token_amount value_satoshis }
        block_inclusions { block { timestamp height } }
      }
    }
  }
}
