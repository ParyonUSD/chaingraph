# L15 startedAndSwappedRedemptions (v1: v1/L15-startedAndSwappedRedemptions.graphql)
# status: works
# chipnet equality: equal-unordered (root order: by store-local ids, not selected) (v1 5 rows in 1 pages, v2 5 rows in 1 pages)
query startedAndSwappedRedemptions($redeemerTokenId: Hex, $node: String!, $limit: Int!, $after: String) {
  output: outputs(node: $node, limit: $limit, after: $after,
    order_by: [{ transaction: { internal_id: ASC } }, { output_index: ASC }],
    where: { token_category: { _eq: $redeemerTokenId }, nonfungible_token_capability: { _eq: MUTABLE } }) {
    has_more end_cursor
    nodes {
      transaction_hash output_index nonfungible_token_commitment
      spent_by { transaction { hash } }
      transaction {
        outputs(where: { output_index: { _lt: 8 } }, order_by: { output_index: ASC }) { token_category nonfungible_token_commitment nonfungible_token_capability fungible_token_amount value_satoshis }
        block_inclusions { block { timestamp height } }
      }
    }
  }
}
