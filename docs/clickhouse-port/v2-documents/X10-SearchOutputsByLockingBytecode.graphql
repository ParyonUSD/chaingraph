# X10 SearchOutputsByLockingBytecode (v1: v1/X10-SearchOutputsByLockingBytecode.graphql)
# status: works
# chipnet equality: equal (v1 71 rows in 1 pages, v2 71 rows in 1 pages)
# latency (chipnet: chipnet_ch_pp2 data + authchain index, p50 warm, first page): v2 57.6 ms; v1 Hasura/Postgres 7.5 ms
query SearchOutputsByLockingBytecode($node: String!, $lockingBytecodes: [Hex!]!, $limit: Int!, $after: String) {
  search_output: outputs(node: $node, limit: $limit, after: $after, where: { locking_bytecode: { _in: $lockingBytecodes } }, order_by: { locking_bytecode: ASC }) {
    has_more
    end_cursor
    nodes { locking_bytecode output_index transaction_hash value_satoshis spent_by { input_index transaction { hash } } }
  }
}
