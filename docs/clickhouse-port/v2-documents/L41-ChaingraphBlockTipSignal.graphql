# L41 ChaingraphBlockTipSignal (v1: v1/L41-ChaingraphBlockTipSignal.graphql)
# status: works
# chipnet equality: equal (v1 1 rows in 1 pages, v2 1 rows in 1 pages)
# latency (chipnet: chipnet_ch_pp2 data + authchain index, p50 warm, first page): v2 21.6 ms; v1 Hasura/Postgres 359.4 ms
subscription ChaingraphBlockTipSignal($node: String!) {
  block: block_tip(node: $node) { hash height previous_block_hash }
}
