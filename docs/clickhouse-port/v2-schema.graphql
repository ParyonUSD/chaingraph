    """
    node: String
    where: NodeBlockFilter
  ): [NodeBlock!]!
  bits: BigInt!

  """The block in the P2P network format."""
  encoded_hex: Hex!

  """The fees of the transactions in the block."""
  fee_satoshis: BigInt!

  """Output value minus input value of the block."""
  generated_value_satoshis: BigInt!
  hash: Hex!

  """The 80-byte block header."""
  header: Hex!
  height: Int!
  input_count: BigInt!
  input_value_satoshis: BigInt!
  internal_id: BigInt!
  merkle_root: Hex!
  nonce: BigInt!
  output_count: BigInt!
  output_value_satoshis: BigInt!
  previous_block_hash: Hex!
  size_bytes: Int!
  timestamp: BigInt!
  transaction_count: Int!

  """The transactions of the block, by transaction_index."""
  transactions(limit: Int, offset: Int, order_by: [BlockTransactionOrderBy!], where: BlockTransactionFilter): [BlockTransaction!]!
  version: Int!
}

input BlockFilter {
  _and: [BlockFilter!]
  _not: BlockFilter
  _or: [BlockFilter!]
  bits: BigIntComparison

  """EXISTS a transaction of the block matching."""
  has_transaction: TransactionFilter
  hash: HexComparison
  height: IntComparison
  internal_id: BigIntComparison
  merkle_root: HexComparison
  nonce: BigIntComparison
  previous_block_hash: HexComparison
  size_bytes: IntComparison
  timestamp: BigIntComparison
  transaction_count: IntComparison
  version: IntComparison
}

