type Block {
  """
  The node's acceptance of this block (per node; empty if it does not accept it).
  """
  accepted_by(
    """
    The node whose view this relationship reads (default: the node of the level above; required below a node-agnostic root). It must be pinned by the request: any `node:` argument of the operation is.
    """
    node: String
    where: NodeBlockFilter
  ): [NodeBlock!]!
  bits: BigInt!

  """The block in the P2P network format."""
  encoded_hex: Hex!

  """The fees of the transactions in the block."""
  fee_satoshis: BigInt!

  """Output value minus input value of the block."""
  generated_value_satoshis: BigInt!
  hash: Hex!

  """The 80-byte block header."""
  header: Hex!
  height: Int!
  input_count: BigInt!
  input_value_satoshis: BigInt!
  internal_id: BigInt!
  merkle_root: Hex!
  nonce: BigInt!
  output_count: BigInt!
  output_value_satoshis: BigInt!
  previous_block_hash: Hex!
  size_bytes: Int!
  timestamp: BigInt!
  transaction_count: Int!

  """The transactions of the block, by transaction_index."""
  transactions(limit: Int, offset: Int, order_by: [BlockTransactionOrderBy!], where: BlockTransactionFilter): [BlockTransaction!]!
  version: Int!
}

