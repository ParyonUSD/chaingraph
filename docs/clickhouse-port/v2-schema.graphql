}

input BooleanComparison {
  _eq: Boolean
  _neq: Boolean
}

"""Bytes as lowercase hexadecimal (no prefix)."""
scalar Hex

"""
Byte comparisons (lexicographic order). `_prefix` / `_prefix_in` match leading bytes; on locking bytecode and NFT commitments they use the sort-key projections. Lists may hold up to 10,000 values (bound in chunks of 1,000).
"""
input HexComparison {
  _eq: Hex
  _gt: Hex
  _gte: Hex
  _in: [Hex!]
  _is_null: Boolean
  _lt: Hex
  _lte: Hex
  _neq: Hex
  _nin: [Hex!]
  _prefix: Hex
  _prefix_in: [Hex!]
}

type Input {
  input_index: Int!

  """
  The output this input spends (null when it is not stored, e.g. for a coinbase input).
  """
  outpoint: Output

  """BigInt: a coinbase input has 4294967295."""
  outpoint_index: BigInt!
  outpoint_transaction_hash: Hex!

  """
  If the last instruction of the unlocking bytecode is a push, the pattern of its contents (P2SH redeem bytecode); else null.
  """
  redeem_bytecode_pattern: Hex
  sequence_number: BigInt!

  """The spending transaction."""
  transaction: Transaction!
  transaction_hash: Hex!
  transaction_internal_id: BigInt!
  unlocking_bytecode: Hex!
  unlocking_bytecode_pattern: Hex!

  """
  The value of the spent output (null when it is not stored, e.g. for a coinbase input).
  """
  value_satoshis: BigInt
}

"""
Predicates on one input row; `outpoint` fields bind to the same row (same-row conjunction).
"""
input InputFilter {
  _and: [InputFilter!]
  _not: InputFilter
  _or: [InputFilter!]
  input_index: IntComparison

  """The spent output matches (no match for a coinbase input)."""
  outpoint: OutputFilter
  outpoint_index: BigIntComparison
  outpoint_transaction_hash: HexComparison
  sequence_number: BigIntComparison

  """The spending transaction matches."""
  transaction: TransactionFilter
  transaction_hash: HexComparison
  transaction_internal_id: BigIntComparison
}

input InputOrderBy {
  input_index: Order
  outpoint_index: Order
  outpoint_transaction_hash: Order
  sequence_number: Order
  transaction: TransactionKeyOrderBy
  transaction_hash: Order
  transaction_internal_id: Order
