"""
Live queries: the full result, re-delivered when it changes after the node watermark advances (one snapshot and one statement per advance, shared by every subscriber of the same document and variables).
"""
type Subscription {
  """
  The node's tip: its accepted block with the greatest height (with previous_block_hash for re-org detection).
  """
  block_tip(node: String!): Block

  """
  Blocks the node accepts (default order: height). Tip: `order_by: { height: DESC }, limit: 1`; by height: `where: { height: { _eq } }`; range: `_gte`/`_lt`; checked heights: `_in`.
  """
  blocks(
    """The end_cursor of the previous page (keyset)."""
    after: String
    limit: Int!
    node: String!

    """
    Rows to skip (offset pagination: discouraged, capped at 100,000; prefer `after`).
    """
    offset: Int
    order_by: [BlockOrderBy!]
    where: BlockFilter
  ): BlockPage!

  """
  Inputs of transactions the node accepts (default keyset order: transaction_internal_id, input_index).
  """
  inputs(
    """The end_cursor of the previous page (keyset)."""
    after: String
    limit: Int!
    node: String!

    """
    Rows to skip (offset pagination: discouraged, capped at 100,000; prefer `after`).
    """
    offset: Int
    order_by: [InputOrderBy!]
    where: InputFilter
  ): InputPage!

  """
  The node's mempool (node_transaction), e.g. `order_by: [{ validated_at: DESC }, { transaction_internal_id: DESC }]`.
  """
  mempool(
    """The end_cursor of the previous page (keyset)."""
    after: String
    limit: Int!
    node: String!

    """
    Rows to skip (offset pagination: discouraged, capped at 100,000; prefer `after`).
    """
    offset: Int
    order_by: [NodeTransactionOrderBy!]
    where: NodeTransactionFilter
  ): NodeTransactionPage!

  """One node: metadata, mempool, accepted blocks."""
  node(node: String!): Node

  """
  Outputs of transactions the node accepts (search by locking bytecode set or prefix, category, commitment prefix …; default keyset order: transaction_internal_id, output_index).
  """
  outputs(
    """The end_cursor of the previous page (keyset)."""
    after: String
    limit: Int!
    node: String!

    """
    Rows to skip (offset pagination: discouraged, capped at 100,000; prefer `after`).
    """
    offset: Int
    order_by: [OutputOrderBy!]
    where: OutputFilter
  ): OutputPage!

  """
  Transactions the node accepts (in a block it accepts or in its mempool), keyset on internal_id: after < internal_id < before (or any `order_by` with `cursor`).
  """
  transactions(
    """internal_id lower bound (exclusive); the default order’s end_cursor."""
    after: BigInt

    """internal_id upper bound (exclusive)."""
    before: BigInt

    """The end_cursor of the previous `order_by` page."""
    cursor: String
    limit: Int!
    node: String!

    """Rows to skip (discouraged; capped at 100,000)."""
    offset: Int
    order: Order = ASC
    order_by: [TransactionOrderBy!]
    where: TransactionFilter
  ): TransactionPage!

  """
  The node's unspent outputs, computed at query time from outputs minus spending inputs (UTXO tables off), keyset on (transaction_internal_id, output_index).
  """
  unspent_outputs(
    """The end_cursor of the previous page (keyset)."""
    after: String
    limit: Int!
    node: String!

    """
    Rows to skip (offset pagination: discouraged, capped at 100,000; prefer `after`).
    """
    offset: Int
    order_by: [OutputOrderBy!]
    where: OutputFilter
  ): OutputPage!
}

"""A point in time, ISO-8601 in UTC with milliseconds."""
scalar Timestamp

input TimestampComparison {
  _eq: Timestamp
  _gt: Timestamp
  _gte: Timestamp
  _is_null: Boolean
  _lt: Timestamp
  _lte: Timestamp
  _neq: Timestamp
}

enum TokenCapability {
  MINTING
  MUTABLE
  NONE
}

input TokenCapabilityComparison {
  _eq: TokenCapability
  _in: [TokenCapability!]
  _is_null: Boolean
  _neq: TokenCapability
  _nin: [TokenCapability!]
}

type Transaction {
  """
  Whether the node accepts the transaction (in a block it accepts or in its mempool).
  """
  accepted(
    """
    The node (required: no field answers "accepted by any node"). Pinned by the request snapshot.
    """
    node: String!
  ): Boolean!

  """
  Node-agnostic: every branch of the identity-output tree from this transaction, over all stored spends of output 0 (conflicting spends and stale blocks included): one Authchain per path to an output 0 no stored transaction spends (`unspent_authhead`) or to the depth limit. For fork analysis; the chain one node accepts is `authchains(node:)`. Longest first.
  """
  authchain_branches(limit: Int, offset: Int): [Authchain!]!

  """
  Per node: the authchain from this transaction (v1 `collect_authchains` at the node's view: output 0 followed through spends the node accepts, to the unspent authhead). At most one element.
  """
  authchains(
    """
    The node whose view this relationship reads (default: the node of the level above; required below a node-agnostic root). It must be pinned by the request: any `node:` argument of the operation is.
    """
    node: String
  ): [Authchain!]!

  """
  Every stored block that includes the transaction (node-agnostic: blocks of stale forks included), by height. `accepted_by: node` keeps the blocks that node accepts; `accepted(node:)` on each inclusion tells them apart.
  """
  block_inclusions(
    """
    Opt-in acceptance: only rows the named node accepts (default: every stored row, node-agnostic). It must be pinned by the request: any `node:` or `accepted_by:` argument of the operation is.
    """
    accepted_by: String
    limit: Int
    offset: Int
    order_by: [BlockInclusionOrderBy!]
    where: BlockInclusionFilter
  ): [BlockInclusion!]!

  """Outputs with value 0 or a locking bytecode beginning with OP_RETURN."""
  data_carrier_outputs(limit: Int, offset: Int, order: Order = ASC, order_by: [OutputOrderBy!], where: OutputFilter): [Output!]!

  """The transaction in the P2P network format."""
  encoded_hex: Hex!

  """Input value minus output value (0 for a coinbase transaction)."""
  fee_satoshis: BigInt!
  hash: Hex!

  """Output 0."""
  identity_output(where: OutputFilter): Output
  input_count: Int!

  """
  The value of the outputs the inputs spend (outputs not stored count 0).
  """
  input_value_satoshis: BigInt!
  inputs(limit: Int, offset: Int, order: Order = ASC, order_by: [InputOrderBy!], where: InputFilter): [Input!]!
  internal_id: BigInt!
  is_coinbase: Boolean!
  locktime: BigInt!

  """
  The node's past validations of the transaction (mempool history: replaced or confirmed).
  """
  node_validation_timeline(
    limit: Int

    """
    The node whose view this relationship reads (default: the node of the level above; required below a node-agnostic root). It must be pinned by the request: any `node:` argument of the operation is.
    """
    node: String
    offset: Int
    order_by: [NodeTransactionHistoryOrderBy!]
  ): [NodeTransactionHistory!]!

  """The node's current validation (the transaction is in its mempool)."""
  node_validations(
    limit: Int

    """
    The node whose view this relationship reads (default: the node of the level above; required below a node-agnostic root). It must be pinned by the request: any `node:` argument of the operation is.
    """
    node: String
    where: NodeTransactionFilter
  ): [NodeTransaction!]!
  output_count: Int!
  output_value_satoshis: BigInt!
  outputs(limit: Int, offset: Int, order: Order = ASC, order_by: [OutputOrderBy!], where: OutputFilter): [Output!]!

  """Output 1 (null if there is none)."""
  signing_output(where: OutputFilter): Output
  size_bytes: Int!
  version: Int!
}

type TransactionAggregate {
  aggregate: TransactionAggregateFields!
}

type TransactionAggregateAvg {
  input_count: Float
  locktime: Float
  output_count: Float
  output_value_satoshis: Float
  size_bytes: Float
}

"""
count, and sum/min/max/avg of the numeric fields (null over no rows, as in SQL).
"""
type TransactionAggregateFields {
  avg: TransactionAggregateAvg!
  count: BigInt!
  max: TransactionAggregateNumeric!
  min: TransactionAggregateNumeric!
  sum: TransactionAggregateNumeric!
}

type TransactionAggregateNumeric {
  input_count: BigInt
  locktime: BigInt
  output_count: BigInt
  output_value_satoshis: BigInt
  size_bytes: BigInt
}

"""
Predicates on one transaction. `has_output` / `has_input` are EXISTS over one output/input row; `block_window`, `in_block` and `in_mempool` are per node.
"""
input TransactionFilter {
  _and: [TransactionFilter!]
  _not: TransactionFilter
  _or: [TransactionFilter!]
  block_window: BlockWindow

  """EXISTS an input of the transaction matching the filter."""
  has_input: InputFilter

  """EXISTS an output of the transaction matching the filter."""
  has_output: OutputFilter
  hash: HexComparison

  """In a block the node accepts that matches (per node)."""
  in_block: BlockFilter

  """In (true) or not in (false) the node's mempool."""
  in_mempool: Boolean
  input_count: IntComparison
  internal_id: BigIntComparison
  is_coinbase: BooleanComparison
  locktime: BigIntComparison
  output_count: IntComparison
  output_value_satoshis: BigIntComparison
  size_bytes: IntComparison
  version: IntComparison
}

type TransactionGroup {
