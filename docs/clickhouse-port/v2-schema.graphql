  _or: [OutputFilter!]
  fungible_token_amount: BigIntComparison
  locking_bytecode: HexComparison
  nonfungible_token_capability: TokenCapabilityComparison
  nonfungible_token_commitment: HexComparison
  output_index: IntComparison

  """
  EXISTS an input spending this output, in a transaction the node accepts, matching (per node).
  """
  spent_by: InputFilter
  token_category: HexComparison

  """The creating transaction matches."""
  transaction: TransactionFilter
  transaction_hash: HexComparison
  transaction_internal_id: BigIntComparison
