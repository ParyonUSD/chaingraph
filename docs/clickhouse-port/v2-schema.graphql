  _and: [InputFilter!]
  _not: InputFilter
  _or: [InputFilter!]
  input_index: IntComparison

  """The spent output matches (no match for a coinbase input)."""
  outpoint: OutputFilter
  outpoint_index: BigIntComparison
  outpoint_transaction_hash: HexComparison
  sequence_number: BigIntComparison

  """The spending transaction matches."""
  transaction: TransactionFilter
  transaction_hash: HexComparison
  transaction_internal_id: BigIntComparison
}

