name: Lint, Build, and Test Chaingraph
on: [push, pull_request]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 14: the oldest supported; 18.3: production. Read streams (17+)
        # behave differently with temporary tables (see the
        # unspent tracking migration), so both are tested.
        postgres: ['14', '18.3']
        unspent-tracking: ['false', 'true']
    env:
      CHAINGRAPH_UNSPENT_TRACKING: ${{ matrix.unspent-tracking }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: chaingraph
          POSTGRES_USER: chaingraph
          POSTGRES_PASSWORD: very_insecure_postgres_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: yarn install --immutable --immutable-cache
      # production settings that change plans and read-ahead (the chart's
      # init-db-config): effective_io_concurrency 200, random_page_cost 1.1
      - name: Configure Postgres like production
        env:
          PGPASSWORD: very_insecure_postgres_password
        run: |
          psql -h localhost -U chaingraph -d chaingraph -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET effective_io_concurrency = '200'" \
            -c "ALTER SYSTEM SET random_page_cost = '1.1'" \
            -c "SELECT pg_reload_conf()"
      - run: yarn test
      - run: yarn cov:lcov
      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Save E2E test logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-log-pg${{ matrix.postgres }}-unspent-${{ matrix.unspent-tracking }}
          path: data/chaingraph/log-e2e.ndjson

  check-yarn-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: yarn install --immutable --immutable-cache --check-cache
