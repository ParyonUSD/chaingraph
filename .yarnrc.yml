nodeLinker: node-modules

# Yarn itself comes from Corepack (package.json "packageManager"); packages are fetched
# from the registry into Yarn's global cache (~/.yarn/berry/cache), not a vendored
# offline cache. See docs/clickhouse-port/yarn-no-submodule.md.
enableGlobalCache: true

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-interactive-tools.cjs
    spec: "@yarnpkg/plugin-interactive-tools"
  - path: .yarn/plugins/@yarnpkg/plugin-production-install.cjs
    spec: "https://gitlab.com/Larry1123/yarn-contrib/-/raw/master/packages/plugin-production-install/bundles/@yarnpkg/plugin-production-install.js"
